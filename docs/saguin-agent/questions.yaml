# The question set. `docker compose exec ai python -m app.questions` runs it.
#
# **Chunking, the embedding model, the prompt and the retrieval depth are all
# knobs somebody will turn**, and without a fixed set of questions with known
# answers, turning them is guesswork - a change that reads better and answers
# worse is indistinguishable from an improvement.
#
# Two kinds of entry:
#   expect_citation  a document or section that must appear in the references,
#                    or a list of them where the fact is stated in more than
#                    one place and any one is a grounded citation
#   expect_refusal   the agent must answer that the documentation does not say
#   context          optional bounded capsule for testing a follow-up whose
#                    words do not stand alone; questions are newest last
#
# The traps are the point. Every one of these is a question where a fluent
# answer from general MQTT knowledge would be wrong about saguin.

- question: How do I turn off certificate verification on a bridge?
  expect_citation: ["bridges.<name>", "examples/saguin.yaml"]
  why: >
    There is no way. A bridge's tls block has ca_file, defaulting to the
    system's roots, and the annotated example says it always verifies. A
    fluent answer invents an insecure or skip-verify key saguin does not have.

- question: Does memory mode survive a power cut?
  expect_citation: ["Sagüin design › Store", "Deliberate constraints"]
  why: >
    No - memory mode restarts from its last snapshot, so what was committed
    after it is lost. The plausible wrong answer is "yes, it persists".

- question: Can two workers get the same job?
  expect_citation: ["A real work queue", "Delivery", "Channels"]
  why: >
    Not at the same time: a queue offers a job to one worker at a time. A
    job whose attempt fails or times out is offered again, so a worker may
    see the same job more than once and workers must be idempotent.

- question: What is the default for allow_anonymous?
  expect_citation: "broker.mqtt"
  why: >
    It follows the password file: true without password_file, false with
    one. True beside an acl_file is refused.

- question: What happens to unacknowledged queue work when the broker restarts?
  expect_citation: ["Recovery model", "Flows › Restart"]
  why: >
    Queue holds are not restored, so a job a worker held is offered again;
    attempt counts and retry times are restored, and restart ends every
    pre-crash attempt. The rule shares little vocabulary with the question,
    so it takes a second search. README's "Recovery model" and the design's
    "Restart" both state it, so either is grounded.

- question: What licence is saguin under?
  expect_citation: ["LICENSE", "Licence"]
  why: >
    Apache 2.0. Retrieval used to miss this entirely because the licence was
    one 11,000-character chunk whose vector meant nothing.

- question: How do I configure per-client ACLs so a device can only publish to its own topic?
  expect_citation: "Access and reload"
  why: >
    An acl_file grant whose filter holds %u, such as `events/%u/#`, is
    substituted with the proved user name, so each device reaches its own
    topics only. The grounded answer is in the design's "Access and reload".

- question: What is saguin's cluster rebalancing strategy?
  expect_citation: ["Deliberate constraints", "Recovery model"]
  why: >
    saguin is one node and one process, with no clustering - README's
    "Deliberate constraints" says so - so the grounded answer is "there is
    none, it does not cluster", citing that section, rather than a refusal.
    A model that invents a rebalancing strategy still fails: it cannot cite
    that section for one.

- question: How many bytes is the MQTT fixed header?
  expect_citation: ["Fixed Header", "Fixed header"]
  why: >
    True of MQTT rather than of saguin, and the MQTT standards are part of
    the corpus: 2 to 5 bytes, the first byte and a Remaining Length of one to
    four bytes. The grounded answer cites the standard's own section.

- question: Show me an example of a queue configured with retries.
  expect_citation: ["examples/saguin.yaml", "channels.<name>"]
  why: >
    A fluent answer invents YAML that does not load. The retry keys are
    retry.max_attempts, retry.mode (fixed, linear or exponential) and
    retry.delay; the annotated example runs a queue with retry.max_attempts.

- question: Is there a complete example configuration file I can start from?
  expect_citation: "examples/saguin.yaml"
  why: >
    There is, and it is indexed so the agent can hand over the real one
    rather than composing a plausible file from fragments.

- question: How do I see the reply to a seek?
  expect_citation: "$saguin topics"
  why: >
    Set a Response Topic and the answer goes there, to the asking
    connection; without one, subscribe to
    `$saguin/consumer/<channel>/seek/reply`. A refused seek still gets a
    PUBACK, with 0x83 under MQTT 5, so a client that exits at the PUBACK
    shows nothing of the refusal.

- question: Can I connect with MQTT 3.1.1?
  expect_citation: ["broker.mqtt", "$saguin topics", "CONNECT"]
  why: >
    Yes by default: min_protocol_version is 3.1.1. The grounded answer says
    what such a client gives up - it cannot be a queue worker and is
    refused with 0x80 if it tries. Only where an operator has set
    min_protocol_version to "5" is 3.1.1 refused at CONNECT.

- question: How do I configure mutual TLS from a bridge to its upstream?
  expect_citation: ["bridges.<name>", "examples/saguin.yaml"]
  why: >
    ca_file checks the far end, cert_file and key_file, written together,
    identify this broker, and min_version is 1.2 or 1.3. There is no
    insecure or skip-verify to suggest.

- question: How do I generate the certificate, key and CA files?
  expect_citation: "The certificates"
  why: >
    openssl commands in examples/README.md. The parts a generic answer
    misses: the subjectAltName is required or modern clients refuse the
    listener, and a device certificate's Common Name is the client's name.

- question: How do I stop the broker writing a line for every client connect?
  expect_citation: ["Logging", "Sagüin configuration › broker"]
  why: >
    Other brokers have a per-connection message switch, so a fluent answer
    invents a key saguin does not have. saguin's answer is broker.log_level
    (debug, info, warn or error), because volume is what a level is for.

- question: Can the Unix socket admit anybody local while the TCP port demands a password?
  expect_citation: ["A listener", "broker.mqtt"]
  why: >
    Yes: password_file and allow_anonymous are valid on any listener, and a
    listener's allow_anonymous defaults to the broker's. The subtle part: a
    listener naming its own password_file defaults to false. And not beside
    an acl_file: allow_anonymous true there is refused.

- question: How long may a socket sit open without sending CONNECT, and does it use a connection slot?
  expect_citation: ["broker.limits", "CONNECT"]
  why: >
    connect_timeout defaults to 10 seconds. An MQTT listener takes a
    connection permit, out of limits.max_connections, before serving a
    connection, so a socket that has not sent CONNECT holds one.

- question: What is the largest CONNECT packet saguin accepts by default?
  expect_citation: "broker.limits"
  why: >
    max_connect_size: the smaller of 100KiB and max_packet_size, read before
    authentication; distinct from the general packet-size limit.

- question: If a fleet exceeds max_connect_rate, are its connections refused?
  expect_citation: "broker.limits"
  why: >
    No. Each MQTT listener accepts at the configured rate (500 by default)
    in bursts of up to twice that, and a connection over the rate waits in
    the accept queue. A plausible rate-limiter answer would describe a
    refusal.

- question: My HTTPS dashboard is behind a proxy and saguin's WebSocket listener is plain HTTP. Why is same_origin refusing it?
  expect_citation: ["A listener", "examples/saguin.yaml"]
  why: >
    same_origin requires a page's origin to equal the request's scheme, host
    and port, and behind a TLS-terminating proxy the schemes differ. Listing
    the dashboard in allowed_origins admits it, since either check
    suffices; disabling both means no origin check at all.

- question: How do I enable QoS 2, and where do unfinished publishes wait?
  expect_citation: ["broker.qos2", "held_publishes"]
  why: >
    There is nothing to enable. broker.qos2 only sets
    max_inflight_per_client, the Receive Maximum sent in CONNACK, 20 by
    default. A publish between PUBREC and PUBREL is stored in the
    held_publishes table. The fluent wrong answer is a boolean to turn on.

- question: A delayed Will is pending. Does a rejected reconnect with the same client id cancel it?
  expect_citation: "CONNECT"
  why: >
    No. After a takeover whose CONNECT is then refused, the old session
    stays away with its delayed Will running; a delayed Will is cancelled
    only by reconnection to the still-existing session before its due time.

- question: And after the broker restarts?
  context:
    questions:
      - What happens to queue work that a worker received but never acknowledged?
    citations:
      - "README.md › Sagüin › What makes it different › A real work queue"
  expect_citation: ["Recovery model", "Flows › Restart"]
  why: >
    The current question contains no queue vocabulary. The prior user question
    is what makes this a queue-restart question: the hold is not restored and
    the job is offered again, while its attempt count remains.

- question: What about normal mode?
  context:
    questions:
      - Does memory mode survive a power cut?
    citations:
      - "docs/design.md › Sagüin design › Store"
  expect_citation: ["Sagüin design › Store", "Deliberate constraints"]
  why: >
    normal mode survives a broker crash whole, but a power cut or an
    operating-system crash loses at most the commits since the last sync.
    Without the preceding question, "What about normal mode?" has no
    specific property to retrieve.

- question: Does that client get reason codes when something is refused?
  context:
    questions:
      - Can an MQTT 3.1.1 client connect to saguin?
    citations:
      - "docs/config.md › Sagüin configuration › broker.mqtt"
  expect_citation: ["CONNECT", "$saguin topics"]
  why: >
    "That client" means the 3.1.1 client from the prior question. It has no
    MQTT 5 reason codes: a refused CONNECT gets the older protocol's return
    code, and a refused worker subscription gets 0x80.
