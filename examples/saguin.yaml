# Every key Sagüin accepts, with defaults and reasons for each setting.
# This is also the configuration the guided tour runs. See docs/config.md.
# Unknown and repeated keys are errors; leave a key out for its default.
# Runtime files are staged under /var/tmp/saguin-demo on every machine.
# Run python3 examples/demo.py --credentials before checking or starting it.

broker:
  # Required: 1-64 ASCII letters, digits, '-' or '_'; shown in logs/metrics.
  id: demo
  # debug, info (default), warn, error. Debug reveals repeated bridge failures.
  log_level: info
  # No pid file by default. A service manager normally tracks the process.
  # Logs go to standard error; the service manager bounds their disk use.
  pid_file: /var/tmp/saguin-demo/saguin.pid

  # Pause publication admission for broker work delayed this long, never for
  # a consumer's acknowledgement or application response. 'none' disables it.
  delivery_admission_delay: 100ms
  # An overdue peer acknowledgement stops contributing to admission delay.
  delivery_peer_timeout: 1s

  # SIGUSR1 reloads log level/origins, then passwords/ACL, then TLS files.
  # Each step is atomic; an invalid step keeps its old copy. Other settings
  # need a restart. SIGHUP and SIGPIPE are ignored; SIGTERM stops gracefully.
  mqtt:
    listen:
      # Writing any listener replaces the default plain TCP listener :1883.
      # A single listener is a mapping. Several of one kind form a list;
      # each then needs a unique name. This file shows both forms.
      tcp:
        - name: fleet
          address: 127.0.0.1:8883
          tls:
            # Both required together. Serve leaf plus intermediate chain.
            # These public demonstration keys must never protect real data.
            cert_file: /var/tmp/saguin-demo/tls/broker.pem
            key_file: /var/tmp/saguin-demo/tls/broker-key.pem
            min_version: "1.2" # default; also accepts "1.3"
            # A verified certificate's CN (else first DNS name) is the user.
            # The password file is then not consulted.
            client_ca_file: /var/tmp/saguin-demo/tls/ca.pem
            # Default true with a CA. False here demonstrates mixed auth:
            # device-7 uses a certificate; demo uses a password on this port.
            # A certificate presented must still verify. Refused without CA.
            require_certificate: false
        - name: local
          address: 127.0.0.1:1884
          # Own password file overrides the broker's for this listener.
          # Its default allow_anonymous is false when it names its own file.
          password_file: /var/tmp/saguin-demo/clients.passwd
          allow_anonymous: false
      ws:
        name: ws # defaults to the kind for a single listener
        address: 127.0.0.1:8083
        tls:
          cert_file: /var/tmp/saguin-demo/tls/broker.pem
          key_file: /var/tmp/saguin-demo/tls/broker-key.pem
        # Without Origin, clients pass. With Origin, either same_origin OR
        # an allowed origin suffices. Both disabled means no origin check.
        same_origin: true
        allowed_origins: [] # no additional origins by default
      unix:
        path: /var/tmp/saguin-demo/saguin.sock # sockets alone may be relative
        mode: "0660" # octal, owner read/write required, at most 0777
        # Only Unix listeners accept a trusted proxy's v2 header. True would
        # refuse the tour's direct connections, which send no proxy header.
        proxy_protocol: false
    # Absolute paths: stage the checked-in files into /var/tmp/saguin-demo.
    # Password format is user:hash ($7$ PBKDF2-SHA512 or legacy $6$).
    password_file: /var/tmp/saguin-demo/clients.passwd
    # Defaults false with a password file, true without. An ACL forbids true
    # on the broker or any listener: grants require a proved identity.
    allow_anonymous: false
    min_protocol_version: "3.1.1" # default; "5" excludes 3.1.1 clients
    acl_file: /var/tmp/saguin-demo/acl.yaml

  # No operations listener by default. Uncomment to observe this broker.
  # Non-loopback TCP needs a password file or a required client certificate.
  # /health is public; other routes require identity or anonymous loopback
  # with an IP-literal/localhost Host (a Unix socket follows that rule too).
  # operations:
  #   listen:
  #     tcp:
  #       name: ops
  #       address: 127.0.0.1:9090
  #       # Optional TLS: same keys/defaults as an MQTT listener.
  #       # tls:
  #       #   cert_file: /etc/saguin/tls/operations.pem
  #       #   key_file: /etc/saguin/tls/operations-key.pem
  #       #   min_version: "1.2"
  #       #   client_ca_file: /etc/saguin/tls/operators-ca.pem
  #       #   require_certificate: true
  #       # password_file: /etc/saguin/operations-remote.passwd
  #     unix:
  #       path: /var/tmp/saguin-demo/operations.sock
  #       mode: "0660"
  #       proxy_protocol: false
  #       # password_file: /etc/saguin/operations-local.passwd
  #   # Separate operators' file, never the clients'. An optional third
  #   # field scopes route prefixes, e.g. /metrics,/v1/operations/queues.
  #   # Certificate identities must be listed if a file is configured.
  #   # There is no allow_anonymous key here or on these listeners.
  #   # password_file: /etc/saguin/operations.passwd
  #   min_scrape_interval: 60s # default and minimum for store metric reads

  # One SQLite file holds ALL channels, retained values and durable sessions.
  # Storage is configured here for the whole broker.
  storage:
    file_path: /var/tmp/saguin-demo/saguin.db
    # full (default): each commit synced, acknowledged writes survive power
    # loss. normal: process crashes lose nothing; power loss may lose commits
    # since the last completed sync. memory: SQLite runs on a tmpfs copy;
    # restart restores the last disk snapshot, offsets included.
    mode: full
    # Both REQUIRED. No invented age or size silently shortens a replay log.
    # 'none' keeps everything for this short demonstration; size the disk.
    default_retention_period: none
    default_retention_bytes: none
    # Default none: group ready writes without deliberately waiting.
    # 2ms for the tour shows collection; at most 1s, milliseconds allowed.
    publish_commit_interval: 2ms
    # Default min(256, max_connections); range 1..max_connections.
    publish_commit_max_records: 4 # small demonstration batch
    read_connections: 2 # default; 2-8, beside the single writer
    # Only with mode: normal (a complete example is support/storage/durable.yaml):
    # sync_interval: 1s # default; minimum 100ms
    # Only with mode: memory (never valid beside mode: full or normal):
    # memory_dir: /var/tmp/saguin-demo/memory # custom tmpfs mount; macOS refused
    # The default RAM directory is documented in config.md. Mount this custom
    # directory as tmpfs before using memory mode; a disk directory is refused.
    # snapshot_interval: 30m # default; minimum 1m, also snapshots on clean stop

  # Every unclaimed topic goes into $broadcast, including QoS 0. New
  # subscribers see retained values then live messages; away durable sessions
  # resume from their cursor. Retention may pass even unfinished deliveries.
  broadcast:
    retention_period: none # defaults to storage.default_retention_period
    retention_bytes: none # defaults to storage.default_retention_bytes
  retained:
    # Current retained values on $broadcast have their own lifetime and size.
    # Replacements/empty retained publications/Message Expiry can end a value.
    retention_period: none # default
    max_bytes: none # default; beyond a set limit a publish gets 0x97
  qos2:
    # Receive Maximum advertised for incoming QoS 1 and 2, 1..65535.
    # Held QoS 2 messages stay until PUBREL or their session ends.
    max_inflight_per_client: 20

  limits:
    max_packet_size: 1MiB # default; 20..268435460 bytes, checked before body
    max_topic_length: 1024 # default bytes, 1..65535
    max_client_id_length: 256 # default bytes, 23..65535
    max_header_count: 32 # default User Properties per publish; excess 0x97
    max_connections: 10000 # default; excess connections wait unserved
    max_subscriptions: 10000 # default filters per session; excess 0x97
    max_topic_levels: 200 # default for topics and filters
    max_session_expiry: 30d # default; at most 4294967295s, also caps 3.1.1
    max_keepalive: none # default; a set cap is at most 65535s, MQTT 5 only
    # Per connection. Over a rate pauses reading; it never refuses a publish.
    # ACL user limits replace each unit separately; 'none' disables a unit.
    publish_rate: none # default messages/s
    publish_bytes: none # default Remaining Length bytes/s
    write_timeout: 5s # default; milliseconds allowed, never none
    connect_timeout: 10s # default; includes TLS/upgrade/PROXY setup
    max_connect_size: 100KiB # default min(100KiB, max_packet_size)
    max_connect_rate: 500 # default per MQTT listener, burst twice; none allowed
    max_inflight: 20 # default outgoing window cap, also capped by Receive Maximum
    # Reservation budget for bodies/deliveries, not process RSS. Must cover
    # max_packet_size plus its largest S2 copy (also topic length for bridge in).
    max_incoming_memory: 32MiB
    max_outgoing_memory: 224MiB # default

# Topic placement compares each level: literal > '+' > '#', first difference
# wins, independent of file order. {a,b} expands alternatives (not on queue).
# These filters each match exactly four levels of the same iot/ hierarchy:
# events, state, presence, work. iot/depot/health/x is $broadcast, as is
# iot/depot/events/x/detail. --route explains placement before publishing.
# One mapping works too; the list demonstrates a separately owned group.
channels:
  - !include /var/tmp/saguin-demo/channels/presence.yaml
  - events:
      type: append
      filter: iot/+/events/+ # default would be events/#
      start: floor # default; tail starts a new reader live, still seekable
      retention_period: none # storage default when omitted
      retention_bytes: none # storage default when omitted; deletes oldest
      max_bytes: none # default; a hard cap refuses a publish with 0x97
    state:
      type: latest
      filter: iot/+/state/+
      retention_period: none # keep current values until replaced or deleted
      # Empty payload leaves a tombstone. Returning/new consumers receive
      # surviving tombstones as empty payloads. RETAIN is 0 on channel deliveries.
      tombstone_retention_period: 1d # default; no retention_bytes/max_bytes here
  - jobs:
      type: queue
      filter: iot/+/work/+
      start: floor # default for READERS of the queue's own topics
      # Workers subscribe to $saguin/queue/jobs at QoS 1 over MQTT 5.
      # Readers replay records without consuming jobs; permissions differ.
      retention_period: none # if set, must exceed visibility_timeout
      retention_bytes: 8MiB # tour setting; default is the storage retention
      # Retention moves unfinished work to jobs__dlq, never refuses a publish.
      # Held jobs wait until their hold ends and do not count toward size.
      visibility_timeout: 5s # tour setting, default 30s; starts at PUBACK
      retry:
        max_attempts: 3 # tour setting, default 5
        mode: linear # tour setting, default fixed; also exponential
        delay: 2s # tour setting, default 5s; milliseconds allowed
      # Wait starts at attempt END: fixed delay, linear delay*n, exponential
      # delay*2^(n-1), where n counts failures. No cap. Response echoes attempt
      # Correlation Data to Response Topic with 'ack' or 'return'.
      dlq_retention_period: none # storage default when omitted
      dlq_retention_bytes: none # storage default when omitted
      # jobs__dlq is derived, never configured. Only broker writes it.
      # Topics are prefixed __dlq/, e.g. __dlq/iot/depot/work/flaky.

# A bridge is an MQTT 5 client of a second broker. No peer is needed by the
# tour, so this complete shape stays commented. Use deployment credentials.
# Its TLS keys belong inside the tls block.
# bridges:
#   head-office:
#     peer: tls://mqtt.example.com:8883 # required; tcp, tls, ws or wss
#     client_id: vessel-07 # required; unique per peer host and port
#     username: gateway # no default
#     password_file: /etc/saguin/bridge.password # password alone; requires username
#     session_expiry: 1d # default; never none, at most 4294967295s
#     receive_maximum: 20 # default; 1..65535
#     ack_interval: 5ms # default; at most 1s
#     tls: # only tls/wss peers
#       ca_file: /etc/saguin/tls/peer-ca.pem # default system roots; always verifies
#       cert_file: /etc/saguin/tls/bridge.pem # optional pair identifies this broker
#       key_file: /etc/saguin/tls/bridge-key.pem
#       min_version: "1.2" # default; also "1.3"
#     topics:
#       - filter: fleet/+/telemetry/#
#         topic: readings/telemetry/$1/$# # required for in/out, forbidden for both
#         direction: in # required; in, out, both
#         qos: 1 # default; 0, 1, 2
#       - filter: alerts/#
#         direction: both # identity mapping, no topic key
#         qos: 1
# Rules' inbound filters, outbound filters and destination topics must not
# overlap. Mapping limits are checked after substitution too. A record that
# arrived by any bridge never leaves by a bridge: the bridge graph is a tree.
# Store before acknowledging still holds. Peer outages do not affect health.
