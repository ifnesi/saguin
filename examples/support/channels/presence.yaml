# A separately owned channel group, included by examples/saguin.yaml.
# An include holds one nonempty group and cannot include another file.
# Its path must be absolute. No broker or storage block belongs in a group.
presence:
  type: latest
  filter: iot/+/presence/+
  # The one SQLite file holds presence alongside every other channel.
  # This value survives a restart and stays until replaced or deleted.
  retention_period: none
