# Standalone normal-mode broker configuration.
# One SQLite file holds the broker's channels and sessions. The storage
# settings show commit collection, read connections and syncing.
# Normal survives process crashes; power loss may lose commits since sync.
broker:
  id: durable-example
  mqtt:
    listen:
      tcp:
        address: 127.0.0.1:1885
    password_file: /var/tmp/saguin-demo/clients.passwd
    allow_anonymous: false
  storage:
    file_path: /var/tmp/saguin-demo/durable.db
    mode: normal
    default_retention_period: none
    default_retention_bytes: none
    publish_commit_interval: 2ms
    publish_commit_max_records: 4
    read_connections: 2
    sync_interval: 1s # default and at least 100ms
