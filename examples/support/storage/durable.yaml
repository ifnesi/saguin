# The sqlite provider for the demo, in a file of its own.
#
# `broker.storage.providers` takes the same two forms as `channels:` -
# one mapping, or a list whose entries are each a group written in place
# or named by `!include`. The team that owns a domain's channels usually
# owns the disk they sit on, and splitting the channels while leaving
# every provider in the master leaves that team editing it anyway.
#
# The rules are the channels' rules: this path resolves against the file
# that named it, this file includes nothing itself, no wildcards, and an
# unknown key here is refused naming this file. A channel in the master
# names `durable` and finds it, because a provider is a name a channel
# refers to rather than a place in the document.

# Records written as they arrive, so a channel here survives a
# crash rather than only a graceful shutdown. One file holds every
# channel the provider owns.
#
# file_path names a file where snapshot_dir names a directory:
# they are not the same kind of thing, and each provider takes only
# its own. There is no default for the same reason there is none
# for snapshot_dir - inventing a filename in your filesystem is not
# saguin's to do.
#
# Every channel type may live here, a queue included: a queue and
# the dead-letter channel it derives share the file, so the move
# between them is one commit.
#
# A power cut is still not free: synchronous=NORMAL does not sync
# at commit, so the last commits can be lost after being
# acknowledged. That is the trade it makes for its write rate.
durable:
  type: sqlite
  file_path: /tmp/saguin-demo/saguin.db

  # The same key, enforced by SQLite itself rather than by saguin:
  # max_page_count bounds the file, and a write past it fails inside
  # the engine, so nothing is counted on the publish path.
  #
  # It therefore measures the file, where a memory provider's
  # measures what was published. Both refuse rather than delete, and
  # both let writes through again once something frees room. The same
  # amount is held back here for the operations that free a full
  # provider - see the memory provider above.
  #
  # SQLite counts a file in 4KiB pages and saguin pins that size, so
  # this figure rounds down to a whole number of them. The broker says
  # at startup what it came to, rather than leaving you to work out why
  # a publish was refused a little sooner than you expected.
  max_bytes: 256MiB

  # Make a transaction wait for the publishes that arrive together, instead
  # of storing only what arrived while the one before it was committing,
  # which is what a provider without these keys does and never waits. Both
  # keys or neither, and there is no default for the count - the number
  # that decides whether this helps at all is how many connections publish
  # at the same time, and saguin cannot know it.
  #
  # A transaction closes at **whichever comes first**:
  # publish_commit_max_records records have arrived, or
  # publish_commit_interval has passed since it opened. Only the first of
  # those is quick. A transaction that fills commits the instant the last
  # record lands; one that does not fill waits out the interval and commits
  # whatever it has - so a count set above the traffic makes every commit a
  # fixed wait, which is slower than not collecting at all. Measured: eight
  # publishing connections against a count of 256 managed 3,400 records a
  # second, against 10,100-11,000 with `none`, 25,000-36,600 with these keys
  # left out and 32,900-33,400 with the count set to 8.
  #
  # **This tour is the small case, and deliberately shows it.** It walks you
  # through one client at a time, so its batches close on the interval
  # rather than on the count, and every publish here waits up to 2ms. Watch
  # that happen: with the monitoring stack running,
  # saguin_storage_commits_total{closed_by="interval"} climbs and
  # {closed_by="records"} does not, and the average batch size sits far
  # below publish_commit_max_records. That is exactly the reading that says
  # a real deployment has set the count too high - here it is the tour's
  # shape rather than a mistake.
  #
  # A fleet sets the count to the connections it expects to be publishing
  # at once. Connections, not records in flight: a client may keep several
  # publishes outstanding, but saguin reads and stores one connection's
  # packets in turn, so one connection fills a batch by one however many it
  # has in the air.
  #
  # What each accepts, all of it refused at startup rather than in silence:
  #
  #   publish_commit_interval     `none`, or 1ms to 1s. Single figures
  #                               are the useful range, because the wait
  #                               is paid per connection: at 1s a client
  #                               that publishes and waits gets one
  #                               message a second. Consumers are not held
  #                               by it - they read beside the writer
  #                               (read_connections, below), and the
  #                               batch collects with no transaction open,
  #                               so even a read on the write connection
  #                               waits only for the commit.
  #   publish_commit_max_records  2 to limits.max_connections. One is not
  #                               a batch, and above the connection limit
  #                               is unreachable - a batch holds at most
  #                               one record per connection, so every
  #                               transaction would wait out the interval
  #                               and commit a handful.
  #
  # Both keys or neither, and there is no default for the count. RFC 0002
  # has the measurements behind all of it.
  publish_commit_interval: 2ms
  publish_commit_max_records: 4

  # Consumers read this provider's channels on read-only connections beside
  # the one writer, so a read never queues behind a commit. Absent is 2, and
  # up to 8. Each is a connection with a page cache of its own: a small box
  # - a Pi, a router - sets 1, or 0 to put every read back on the write
  # connection: less memory, and consumers wait behind publishes. RFC 0002
  # "How a sqlite provider reads".
  read_connections: 2
