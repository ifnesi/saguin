# A home hub on a Raspberry Pi: a few dozen devices, one SQLite file on the
# SD card, and no TLS inside the house.
# A starting point to adapt. Stage demo credentials first (examples/README.md).
# Runtime files use /var/tmp/saguin-demo; adapt paths and credentials for deployment.

broker:
  id: home-hub
  mqtt:
    listen:
      tcp:
        address: 0.0.0.0:1883
    # Password authentication: every device has a password, and no
    # client connects without one.
    password_file: /var/tmp/saguin-demo/clients.passwd
    allow_anonymous: false
  # A week of readings bounded inside the SD card. SQLite reuses freed
  # pages; the file stays at its peak size. There is no provider max_bytes.
  storage:
    file_path: /var/tmp/saguin-demo/home.db
    mode: normal
    default_retention_period: 7d
    default_retention_bytes: 256MiB
    # Two to eight readers sit beside the one writer.
    read_connections: 2
    # Longer sync intervals spare the SD card. A power cut may lose commits
    # since the last completed sync; a process crash loses none.
    sync_interval: 150ms
  # Retained broadcast values share the same file and survive process crashes.
  retained:
    retention_period: none
  limits:
    # A machine short of memory is better served by fewer connections.
    max_connections: 200
channels:
  readings:
    type: append
    filter: home/+/readings/#
  state:
    type: latest
    filter: home/+/state/#
    # A current value is kept until it is replaced, however old.
    retention_period: none
