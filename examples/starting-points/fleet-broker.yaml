# A fleet broker with TLS and ACLs: tens of thousands of devices, each allowed only its own topics, with events, current status and a work queue.
# A starting point to adapt. Stage demo credentials first (examples/README.md).
# Runtime files use /var/tmp/saguin-demo; adapt paths and credentials for deployment.

broker:
  id: fleet-1
  mqtt:
    listen:
      tcp:
        address: 0.0.0.0:8883
        # TLS on a listener: a fleet reaches the broker over
        # networks nobody here controls.
        tls:
          cert_file: /var/tmp/saguin-demo/tls/broker.pem
          key_file: /var/tmp/saguin-demo/tls/broker-key.pem
    password_file: /var/tmp/saguin-demo/clients.passwd
    allow_anonymous: false
    # ACL grants: each device reaches only its own
    # topics.
    acl_file: /var/tmp/saguin-demo/fleet-acl.yaml
  # Operations: metrics and health on loopback.
  operations:
    listen:
      tcp:
        address: 127.0.0.1:9090
  # Three days by age; each channel can set its own size retention.
  storage:
    file_path: /var/tmp/saguin-demo/fleet.db
    mode: full
    default_retention_period: 3d
    default_retention_bytes: none

  limits:
    # Served connections plus headroom. Excess connections wait unserved;
    # their CONNECT deadline begins when they receive a service permit.
    max_connections: 50000
    # Default 30d; a day bounds sessions of devices that never return.
    # The channel's retention can pass a session's position meanwhile.
    max_session_expiry: 1d
channels:
  events:
    type: append
    filter: fleet/+/events/#
    retention_bytes: 20GiB
  status:
    type: latest
    filter: fleet/+/status
    retention_period: 30d
  jobs:
    type: queue
    filter: fleet/+/work
    visibility_timeout: 30s
    retry:
      max_attempts: 5
      mode: exponential
      delay: 2s
