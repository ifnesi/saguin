# An edge gateway on sqlite, bridged to a head office: devices over TLS, telemetry kept for a week on the gateway and shipped upstream.
# A starting point to adapt. Stage demo credentials first (examples/README.md).
# Runtime files use /var/tmp/saguin-demo; adapt paths and credentials for deployment.

broker:
  id: plant-gw-1
  mqtt:
    listen:
      tcp:
        address: 0.0.0.0:8883
        # TLS on a listener: devices reach the gateway over the
        # plant network.
        tls:
          cert_file: /var/tmp/saguin-demo/tls/broker.pem
          key_file: /var/tmp/saguin-demo/tls/broker-key.pem
    password_file: /var/tmp/saguin-demo/clients.passwd
    allow_anonymous: false
  # Operations: metrics and health on loopback,
  # for a local agent to scrape.
  operations:
    listen:
      tcp:
        address: 127.0.0.1:9090
  # Keep a week locally to ride out an upstream outage. Size the disk
  # for the peak database; retention frees pages but never shrinks the file.
  storage:
    file_path: /var/tmp/saguin-demo/plant.db
    mode: full
    default_retention_period: 7d
    default_retention_bytes: 512MiB

channels:
  telemetry:
    type: append
    filter: plant/+/telemetry/#
  setpoints:
    type: latest
    filter: plant/+/setpoint/#
    # A setpoint is kept until it is replaced.
    retention_period: none
# Bridges: telemetry shipped to the head office under this
# gateway's own prefix.
bridges:
  head-office:
    peer: tls://mqtt.example.com:8883
    client_id: plant-gw-1
    session_expiry: 1d
    topics:
      - filter: plant/+/telemetry/#
        topic: sites/plant-gw-1/$1/telemetry/$#
        direction: out
