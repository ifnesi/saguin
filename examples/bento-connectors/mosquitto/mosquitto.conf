# The upstream the bridge reads from.
#
# It is here to be a broker that is not saguin - an inbound bridge carries
# records from somebody else's estate, and bridging saguin to saguin would
# demonstrate the wrong thing. Nothing is persisted and nobody authenticates:
# this exists so that five saguin_bridge_* metrics have a link to describe.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
