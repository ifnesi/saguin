# Bento publishes readings here; a separate inbound bridge reads mosquitto.
# Paths belong to the broker container and are mounted by Compose.
broker:
  id: bento-connectors
  log_level: info
  mqtt:
    listen:
      tcp:
        address: 0.0.0.0:1883
  operations:
    listen:
      tcp:
        address: 0.0.0.0:9090
    password_file: /etc/saguin/operations.passwd
    min_scrape_interval: 60s
  storage:
    file_path: /var/lib/saguin/saguin.db
    mode: full
    default_retention_period: none
    default_retention_bytes: none
    publish_commit_interval: 5ms
    publish_commit_max_records: 16
  retained:
    retention_period: 1h

channels:
  weather-measurement:
    type: append
    filter: iot/weather/measurement/+
    retention_period: 1h
  water-measurement:
    type: append
    filter: iot/water/measurement/+
    retention_period: 1h
  water-location:
    type: latest
    filter: iot/water/location/+
  schemas:
    type: latest
    filter: schemas/#
  jobs:
    type: queue
    filter: iot/tasks/+/+
    retention_period: 5m
    retention_bytes: 8MiB
    visibility_timeout: 5s
    retry:
      max_attempts: 3
      mode: linear
      delay: 1s
    dlq_retention_period: 15m
  fleet:
    type: append
    filter: iot/fleet/+/+
    retention_period: 30s

bridges:
  head-office:
    peer: tcp://mosquitto:1883
    client_id: saguin-connectors
    topics:
      - filter: fleet/+/telemetry/+
        topic: iot/fleet/$2/$1
        direction: in
        qos: 1
