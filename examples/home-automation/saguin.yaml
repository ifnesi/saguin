# Two gateways, separate identities, one persistent SQLite store.
# Paths belong to the broker container and are mounted by Compose.
broker:
  id: home-hub
  log_level: info
  mqtt:
    listen:
      tcp:
        address: 0.0.0.0:1883
        # For certificates issued by your authority, use port 8883 and:
        # tls:
        #   cert_file: /etc/saguin/tls/broker.pem
        #   key_file: /etc/saguin/tls/broker-key.pem
        #   min_version: "1.2"
        #   client_ca_file: /etc/saguin/tls/ca.pem
    password_file: /etc/saguin/clients.passwd
    allow_anonymous: false
    acl_file: /etc/saguin/acl.yaml
  operations:
    listen:
      tcp:
        address: 0.0.0.0:9090
    password_file: /etc/saguin/operations.passwd
  storage:
    file_path: /var/lib/saguin/home.db
    mode: full
    default_retention_period: none
    default_retention_bytes: none
    read_connections: 2
  retained:
    retention_period: none

channels:
  # First-time readers see live readings; durable sessions resume their place.
  devices:
    type: append
    filter: zigbee2mqtt/+
    start: tail
    retention_period: 7d
    retention_bytes: 256MiB
  bridge_state:
    type: latest
    filter: zigbee2mqtt/bridge/+
  # Written levels take precedence over bridge_state's wildcard.
  bridge_events:
    type: append
    filter: zigbee2mqtt/bridge/event
    retention_period: 7d
    retention_bytes: 16MiB
  bridge_log:
    type: append
    filter: zigbee2mqtt/bridge/logging
    retention_period: 7d
    retention_bytes: 64MiB
  rf_readings:
    type: append
    filter: rtl433/devices/+/+/+/+
    start: tail
    retention_period: 7d
    retention_bytes: 128MiB
  rf_gateway:
    type: latest
    filter: rtl433/availability
