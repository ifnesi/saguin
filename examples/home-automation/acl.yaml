# Each gateway writes only its own topics. Readers may send Zigbee commands.
roles:
  zigbee-bridge:
    - channel: devices
      allow: [write, read]
    - channel: bridge_state
      allow: [write, read]
    - channel: bridge_events
      allow: [write, read]
    - channel: bridge_log
      allow: [write, read]
    - topic: zigbee2mqtt/#
      allow: [read]
    - topic: zigbee2mqtt/bridge/response/#
      allow: [write]
  rf-bridge:
    - channel: rf_readings
      allow: [write]
    - channel: rf_gateway
      allow: [write]
    - topic: rtl433/events
      allow: [write]
    - topic: rtl433/states
      allow: [write]
  home-reader:
    - channel: devices
      allow: [read]
    - channel: bridge_state
      allow: [read]
    - channel: bridge_events
      allow: [read, seek]
    - channel: bridge_log
      allow: [read, seek]
    - channel: rf_readings
      allow: [read, seek]
    - channel: rf_gateway
      allow: [read]
    - topic: "#"
      allow: [read]
    - topic: zigbee2mqtt/+/set
      allow: [write]
    - topic: zigbee2mqtt/bridge/request/#
      allow: [write]
  # The viewer: it reads and replays every channel, reads every broadcast
  # topic, sends a command from its publish form and may disconnect a client.
  home-viewer:
    - channel: devices
      allow: [read, seek]
    - channel: bridge_state
      allow: [read]
    - channel: bridge_events
      allow: [read, seek]
    - channel: bridge_log
      allow: [read, seek]
    - channel: rf_readings
      allow: [read, seek]
    - channel: rf_gateway
      allow: [read]
    - topic: "#"
      allow: [read]
    - topic: zigbee2mqtt/+/set
      allow: [write]
    - broker: sessions
      allow: [disconnect]
users:
  zigbee2mqtt-hub-1:
    roles: [zigbee-bridge]
    client_ids: "%u"
    limits:
      publish_rate: 200
      publish_bytes: 256KiB
  # rtl_433 generates its own client id from its driver string.
  rtl433-hub-1:
    roles: [rf-bridge]
    client_ids: "rtl_433-*"
    limits:
      publish_rate: 100
      publish_bytes: 64KiB
  "reader-*":
    roles: [home-reader]
    client_ids: "%u"
  # The viewer reads on its own client id and publishes on a short-lived
  # second connection named after it.
  viewer-hub:
    roles: [home-viewer]
    client_ids: ["%u", "%u-pub-*"]
